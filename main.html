<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BloxWorld</title>
<!-- Three.js z oficjalnego CDN (cdnjs) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8ec5ff;
    font-family: "Segoe UI", Arial, sans-serif; }
  canvas { display: block; }
  /* Panel interfejsu w lewym górnym rogu */
  #ui { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: calc(14px + env(safe-area-inset-left, 0px)); color: #fff; user-select: none;
    background: rgba(25, 27, 32, .78); padding: 12px 16px; border-radius: 6px; min-width: 210px; }
  #logo { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  /* Logo: przechylony kwadrat z wewnętrznym "okienkiem", jak w stylu Roblox */
  #logo i { width: 26px; height: 26px; background: #e2231a; transform: rotate(-14deg);
    display: grid; place-items: center; border-radius: 3px; }
  #logo i::after { content: ""; width: 9px; height: 9px; background: #fff; }
  #logo b { font-size: 22px; letter-spacing: 1px; font-weight: 900; }
  #score { font-size: 18px; margin: 4px 0 8px; color: #ffd83a; font-weight: 700; }
  #help { font-size: 13px; line-height: 1.6; opacity: .9; }
  kbd { background: #3a3f4a; padding: 1px 6px; border-radius: 3px; font-family: inherit; }
</style>
</head>
<body>
<div id="ui">
  <div id="logo"><i></i><b>BLOXWORLD</b></div>
  <div id="score">Punkty: 0</div>
  <div id="help">
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> = Ruch<br>
    <kbd>Spacja</kbd> = Skok<br>
    <b>Mysz</b> = Obrót kamery (kliknij w grę lub przeciągnij)<br>
    <b>Kółko</b> = Zoom &nbsp; <kbd>Q</kbd>/<kbd>E</kbd> = Obrót
  </div>
</div>

<script>
// ================= SCENA, KAMERA, RENDERER =================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8ec5ff);
scene.fog = new THREE.Fog(0x8ec5ff, 80, 200);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ================= OŚWIETLENIE =================
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 150 });
scene.add(sun, sun.target);

// ================= ŚWIAT: BASEPLATE + KLOCKI =================
const SIZE = 200;
// Szara płyta "Baseplate" z siatką jak w Roblox Studio
const base = new THREE.Mesh(new THREE.BoxGeometry(SIZE, 1, SIZE),
  new THREE.MeshLambertMaterial({ color: 0x7d8790 }));
base.position.y = -0.5; base.receiveShadow = true; scene.add(base);
const grid = new THREE.GridHelper(SIZE, SIZE / 4, 0x4b535a, 0x646d75);
grid.position.y = 0.02; scene.add(grid);

// Lista brył kolizyjnych (AABB) – klocki, na które można wskakiwać
const boxes = [];
function addBrick(x, z, w, h, d, color) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color }));
  m.position.set(x, h / 2, z); m.castShadow = m.receiveShadow = true; scene.add(m);
  boxes.push({ minX: x - w / 2, maxX: x + w / 2, minY: 0, maxY: h, minZ: z - d / 2, maxZ: z + d / 2 });
}
// x, z, szerokość, wysokość, głębokość, kolor
[[8, -8, 6, 2, 6, 0xe2231a], [14, -8, 6, 4, 6, 0xf5c518], [20, -8, 6, 6, 6, 0x2f8cff],
 [-10, -12, 8, 3, 4, 0x2ecc71], [-18, -12, 6, 5, 6, 0xa04fd8], [0, -25, 12, 2, 4, 0xff7f2a],
 [-8, 10, 5, 2, 5, 0x19b5a5], [-14, 10, 5, 4, 5, 0xe84a8a], [12, 14, 8, 3, 8, 0x8bc34a],
 [24, 8, 4, 8, 4, 0x3f51b5]].forEach(a => addBrick(...a));

// Monety do zbierania (punkty) – obracające się żółte krążki
const coins = [];
[[8, 3.2, -8], [14, 5.2, -8], [20, 7.2, -8], [-10, 4.2, -12], [-18, 6.2, -12], [0, 3.2, -25],
 [-8, 3.2, 10], [-14, 5.2, 10], [12, 4.2, 14], [24, 9.2, 8], [0, 1.5, -6], [-5, 1.5, 4]].forEach(p => {
  const geo = new THREE.CylinderGeometry(0.8, 0.8, 0.2, 20); geo.rotateX(Math.PI / 2);
  const c = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: 0xffd83a, emissive: 0x664400 }));
  c.position.set(...p); c.castShadow = true; scene.add(c); coins.push(c);
});

// ================= POSTAĆ GRACZA (BLOCKY AVATAR) =================
// Proporcje klasycznego ludzika (jednostki = "studs"): głowa 2x1x1, tułów 2x2x1, kończyny 1x2x1 → wysokość 5
const player = new THREE.Group();
const mat = c => new THREE.MeshLambertMaterial({ color: c });
function part(w, h, d, color, x, y, z, pivotTop) {
  const g = new THREE.BoxGeometry(w, h, d);
  if (pivotTop) g.translate(0, -h / 2, 0);        // oś obrotu u góry kończyny (bark / biodro)
  const m = new THREE.Mesh(g, mat(color)); m.position.set(x, y, z); m.castShadow = true;
  player.add(m); return m;
}
const legL = part(1, 2, 1, 0x2ecc71, -0.5, 2, 0, true);
const legR = part(1, 2, 1, 0x2ecc71, 0.5, 2, 0, true);
const torso = part(2, 2, 1, 0x2f8cff, 0, 3, 0);
const armL = part(1, 2, 1, 0xf5c518, -1.5, 4, 0, true);   // ręce żółte jak skóra
const armR = part(1, 2, 1, 0xf5c518, 1.5, 4, 0, true);
const head = part(2, 1, 1, 0xf5c518, 0, 4.5, 0);
// Prosta twarz na przedniej ścianie głowy (+Z): oczy i uśmiech
part(0.25, 0.25, 0.05, 0x111111, -0.45, 4.6, 0.53);
part(0.25, 0.25, 0.05, 0x111111, 0.45, 4.6, 0.53);
part(0.8, 0.12, 0.05, 0x111111, 0, 4.25, 0.53);
scene.add(player);

// ================= STEROWANIE =================
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Space') e.preventDefault(); });
addEventListener('keyup', e => keys[e.code] = false);

// ================= MYSZ: OBRÓT KAMERY =================
// Kliknięcie w grę przechwytuje kursor (Pointer Lock); gdy przeglądarka na to nie pozwala,
// kamerę można obracać przeciągając myszą z wciśniętym przyciskiem.
let pitch = 0.4, camDist = 14;                      // kąt nachylenia kamery i dystans za plecami
const el = renderer.domElement;
function obrot(dx, dy) {
  yaw -= dx * 0.005;                                // mysz w prawo = widok w prawo
  pitch = Math.max(0.05, Math.min(1.3, pitch + dy * 0.005));
}
el.addEventListener('click', () => {
  try { const r = el.requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch (e) {}
});
el.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('mousemove', e => {
  if (document.pointerLockElement === el || e.buttons & 3) obrot(e.movementX, e.movementY);
});
el.addEventListener('wheel', e => {
  e.preventDefault();
  camDist = Math.max(6, Math.min(30, camDist + e.deltaY * 0.01));
}, { passive: false });

// ================= FIZYKA GRACZA =================
const p = { x: 0, y: 0, z: 0, vy: 0, onGround: true };
const HW = 1, H = 5;                                  // połowa szerokości i wysokość hitboxa
const SPEED = 16, GRAV = -60, JUMP = 28;
let yaw = 0, walkPhase = 0, walkAmp = 0, score = 0;

// Czy hitbox gracza nachodzi na bryłę b
const hit = b => p.x + HW > b.minX && p.x - HW < b.maxX && p.y + H > b.minY && p.y < b.maxY &&
                 p.z + HW > b.minZ && p.z - HW < b.maxZ;

function ruchGracza(dt) {
  // Obrót kamery wokół postaci
  if (keys.KeyQ) yaw += 1.8 * dt;
  if (keys.KeyE) yaw -= 1.8 * dt;

  // Kierunki "do przodu" i "w prawo" względem kamery (kamera jest za plecami postaci)
  const fx = -Math.sin(yaw), fz = -Math.cos(yaw), rx = Math.cos(yaw), rz = -Math.sin(yaw);
  let ix = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
  let iz = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0);
  let dx = fx * iz + rx * ix, dz = fz * iz + rz * ix;
  const len = Math.hypot(dx, dz);
  const idzie = len > 0;
  if (idzie) {
    dx /= len; dz /= len;                              // normalizacja – skos nie jest szybszy
    // Płynny obrót postaci w stronę ruchu
    const cel = Math.atan2(dx, dz);
    let diff = cel - player.rotation.y;
    diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    player.rotation.y += diff * Math.min(1, 14 * dt);
  }

  // Ruch po osi X, potem Z (osobno, by ślizgać się po ścianach klocków)
  p.x += dx * SPEED * dt;
  for (const b of boxes) if (hit(b)) p.x = dx > 0 ? b.minX - HW : b.maxX + HW;
  p.z += dz * SPEED * dt;
  for (const b of boxes) if (hit(b)) p.z = dz > 0 ? b.minZ - HW : b.maxZ + HW;
  p.x = Math.max(-98, Math.min(98, p.x)); p.z = Math.max(-98, Math.min(98, p.z));

  // Skok i grawitacja (skok tylko gdy stoimy na ziemi/klocku)
  if (keys.Space && p.onGround) { p.vy = JUMP; p.onGround = false; }
  p.vy += GRAV * dt;
  p.y += p.vy * dt;
  p.onGround = false;
  if (p.y <= 0) { p.y = 0; p.vy = 0; p.onGround = true; }          // lądowanie na płycie
  for (const b of boxes) if (hit(b)) {
    if (p.vy <= 0) { p.y = b.maxY; p.onGround = true; }             // lądowanie na klocku
    else p.y = b.minY - H;                                          // uderzenie głową od dołu
    p.vy = 0;
  }

  // Animacja chodzenia: ręce i nogi kołyszą się naprzemiennie (sinus), amplituda rośnie/maleje płynnie
  walkAmp += ((idzie && p.onGround ? 1 : 0) - walkAmp) * Math.min(1, 12 * dt);
  walkPhase += dt * 12 * (idzie ? 1 : 0);
  const sw = Math.sin(walkPhase) * 0.9 * walkAmp;
  legL.rotation.x = sw;  legR.rotation.x = -sw;
  armL.rotation.x = -sw; armR.rotation.x = sw;
  if (!p.onGround) { armL.rotation.x = armR.rotation.x = -2.6 * 0.3; }  // ręce w górę w powietrzu

  player.position.set(p.x, p.y, p.z);
}

// ================= KAMERA TPP =================
const camTarget = new THREE.Vector3();
function kamera(dt) {
  // Pozycja docelowa: stały dystans za plecami (zgodnie z kierunkiem yaw) i nad postacią
  const h = Math.cos(pitch) * camDist;
  camTarget.set(p.x + Math.sin(yaw) * h, p.y + 3 + Math.sin(pitch) * camDist, p.z + Math.cos(yaw) * h);
  camera.position.lerp(camTarget, Math.min(1, 6 * dt));            // płynne podążanie
  camera.lookAt(p.x, p.y + 3, p.z);
}

// ================= MONETY I PUNKTY =================
const scoreEl = document.getElementById('score');
function monety(t) {
  for (const c of coins) {
    if (!c.visible) continue;
    c.rotation.y = t * 3;
    if (Math.hypot(c.position.x - p.x, c.position.z - p.z) < 2 && Math.abs(c.position.y - (p.y + 2.5)) < 3) {
      c.visible = false; score += 10; scoreEl.textContent = 'Punkty: ' + score;
    }
  }
}

// ================= PĘTLA GRY =================
// requestAnimationFrame wywołuje loop przed każdym odświeżeniem ekranu (~60 razy/s).
// dt = czas od poprzedniej klatki, dzięki czemu ruch nie zależy od liczby FPS.
const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  ruchGracza(dt);
  kamera(dt);
  monety(clock.elapsedTime);
  // Światło z cieniami podąża za graczem, żeby cienie były ostre wszędzie
  sun.position.set(p.x + 30, 60, p.z + 20); sun.target.position.set(p.x, 0, p.z);
  renderer.render(scene, camera);
}
camera.position.set(0, 8, 14);
loop();
</script>
</body>
</html>
